plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven {
            name = 'GeckoLib'
            url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroup('software.bernie.geckolib')
            }
        }
        maven {
            name = 'BlameJared'
            url = 'https://maven.blamejared.com'
            content {
                includeGroup('vazkii.patchouli')
            }
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    if (rootProject.hasProperty('supporter') && project.name != 'common') {
        def marker = layout.buildDirectory.dir('generated/supporter')
        def supporterMarker = tasks.register('supporterMarker') {
            outputs.dir marker
            doLast {
                def file = marker.get().file('jojoha_supporter_build').asFile
                file.parentFile.mkdirs()
                file.text = 'supporter'
            }
        }
        tasks.named('processResources') {
            from(supporterMarker)
        }
        tasks.named('remapJar') {
            archiveClassifier = 'supporter'
        }
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
        }
    }
}
