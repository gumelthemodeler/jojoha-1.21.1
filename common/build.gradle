architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Compile-only: GeckoLib's API classes are identical across platforms, so common code (the
    // Stand's GeoEntity/GeoModel/animation controllers) can reference them here without bundling
    // GeckoLib itself in common. Each platform subproject supplies the real, platform-specific
    // artifact at runtime via modImplementation + include (see fabric/neoforge build.gradle).
    modCompileOnly "software.bernie.geckolib:geckolib-fabric-$rootProject.minecraft_version:$rootProject.geckolib_version"
}
